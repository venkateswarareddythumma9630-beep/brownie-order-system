spring.application.name=brownie-order-system
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/brownies}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:brownie_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.port=${PORT:8080}
brownie.whatsapp-number=${BROWNIE_WHATSAPP_NUMBER:}
brownie.product-name=${BROWNIE_PRODUCT_NAME:Brownie Cake}
brownie.price=${BROWNIE_PRICE:100}
